<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>{{ san_pham.ten_san_pham }} - Mai Trang</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background: #f4f4f4; }
        header { background: #004b87; color: white; padding: 15px 50px; }
        header a { color: white; text-decoration: none; font-weight: bold; }
        .container { padding: 40px 50px; max-width: 900px; margin: auto; background: white; margin-top: 30px; border-radius: 8px; }
        .product-detail { display: flex; gap: 30px; }
        .product-detail img { width: 50%; border-radius: 8px; object-fit: cover; }
        .info h1 { color: #004b87; margin-top: 0; }
        .price { color: #d9534f; font-size: 20px; font-weight: bold; }
        .btn-back { display: inline-block; margin-top: 20px; padding: 10px 20px; background: #004b87; color: white; text-decoration: none; border-radius: 5px; }
    </style>
</head>
<body>
    <header>
        <h2><a href="/"> CÔNG TY XÂY LẮP MAI TRANG</a></h2>
    </header>

    <div class="container">
        <div class="product-detail">
            {% if san_pham.anh_san_pham %}
                <img src="{{ san_pham.anh_san_pham.url }}" alt="{{ san_pham.ten_san_pham }}">
            {% endif %}
            <div class="info">
                <h1>{{ san_pham.ten_san_pham }}</h1>
                <p class="price">Giá: {{ san_pham.gia }}</p>
                <hr>
                <h3>Mô tả chi tiết:</h3>
                <p>{{ san_pham.mo_ta }}</p>
                <a href="/" class="btn-back">← Quay lại Trang Chủ</a>
            </div>
        </div>
    </div>
</body>
</html>
